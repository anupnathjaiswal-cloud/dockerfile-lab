services:
  chrome:
    image: selenium/standalone-chrome:latest
    shm_size: 2gb
    ports:
      - "4444:4444"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4444/status || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  test:
    build: .
    environment:
      SELENIUM_REMOTE_URL: http://chrome:4444
    depends_on:
      chrome:
        condition: service_healthy
